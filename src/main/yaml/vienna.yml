#    parameters: [onlyfinite, [sum]]

pools:
  - pool: &moveWithTraces
    - time-distribution: *moveFrequency
      type: Event
      actions:
        - *ReproduceGPSTrace
  - pool: &move
    - time-distribution: 0.1
      type: Event
      actions:
        - *ReproduceGPSTrace
  - pool: &crowd
    - time-distribution: 1
      program: crowd
    - program: send

displacements:
  - in:
      type: FromGPSTrace
      parameters: [1497, "vcmuser.gpx", false, AlignToTime, 1365922800, false, false]
    programs:
      - *move
#      - *crowd
    contents:
      - molecule: human
        concentration: true
  - in:
      type: Rectangle
      parameters: [1000, 48.17, 16.3, 0.07, 0.15]
